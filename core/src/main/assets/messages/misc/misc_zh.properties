rules.ruleruntime.vocabulary=\n核心词条：%s

rules.corerulevocabulary.none=空置词条
rules.corerulevocabulary.none_desc=保留这个空槽，不占用规则容量。
rules.corerulevocabulary.accumulation=蓄势
rules.corerulevocabulary.accumulation_desc=你的移动、命中、受伤或等待类反应事件会积累蓄势。达到 3 层后，下一项兼容技能获得 50% 强化并消耗蓄势。
rules.corerulevocabulary.overdraw=透支
rules.corerulevocabulary.overdraw_desc=发动技能时若资源不足，每缺少 1 点可以改为消耗 2 点生命。透支不会使生命降至 1 以下。
rules.corerulevocabulary.overflow=溢流
rules.corerulevocabulary.overflow_desc=资源达到上限后，每溢出 2 点转化为 1 点护盾。转化不会生成资源，无法形成无损循环。
rules.corerulevocabulary.compensation=代偿
rules.corerulevocabulary.compensation_desc=已支付的技能效果确实无法发生时，改为获得 2 点护盾。代偿随后锁定 5 回合。
rules.corerulevocabulary.phase_shift=相变
rules.corerulevocabulary.phase_shift_desc=生命不高于 30% 时，没有其它调整的技能会影响附近目标；脱离低血状态后结束。
rules.corerulevocabulary.echo=残响
rules.corerulevocabulary.echo_desc=主动技成功后，3 回合后再执行一次弱化副本。残响本身不会继续产生残响。
rules.corerulevocabulary.hunt_mark=猎印
rules.corerulevocabulary.hunt_mark_desc=连续命中同一敌人会叠加猎印。达到 3 层后，下一项对其成功的技能会消耗猎印并施加减速。
rules.corerulevocabulary.propagation=传播
rules.corerulevocabulary.propagation_desc=带有猎印的敌人死亡时，最多 2 层猎印会转移给最近敌人；转移后的猎印不能再次传播。
rules.corerulevocabulary.inertia_bridge=惯性桥接
rules.corerulevocabulary.inertia_bridge_desc=强制位移也视为移动，因此击退和拉拽能够触发你的移动反应技。
rules.corerulevocabulary.translocation_bridge=抵达桥接
rules.corerulevocabulary.translocation_bridge_desc=传送或交换位置也视为进入格子，因此能够触发踏入地形类反应技。
rules.corerulevocabulary.translocation_backlash=跃迁反作用
rules.corerulevocabulary.translocation_backlash_desc=传送或交换位置后，自身减速 3 回合。代价与实际使用的机动能力直接相关。
rules.corerulevocabulary.shield_backlash=壁垒反作用
rules.corerulevocabulary.shield_backlash_desc=规则提供护盾时，自身也会陷入 3 回合易伤。
rules.classlaw.forced_movement_counts_as_move_name=位移即行动
rules.classlaw.forced_movement_counts_as_move_desc=你的技能强制移动角色时，这次位移也会触发移动反应。
rules.classlaw.forced_movement_counts_as_move_summary=击退、拉近和投掷也会被视为移动。
rules.classlaw.forced_movement_counts_as_move_detail=每次成功的强制位移都会额外触发一次移动事件，同时保留原本的位移来源。所有兼容的移动反应都能响应它。
rules.classlaw.translocation_counts_as_enter_tile_name=抵达即踏入
rules.classlaw.translocation_counts_as_enter_tile_desc=传送、冲刺或换位后，也会在目的地触发进入格子的反应。
rules.classlaw.translocation_counts_as_enter_tile_summary=位移到目的地也会被视为踏入该格。
rules.classlaw.translocation_counts_as_enter_tile_detail=每次成功传送、冲刺或换位都会被视为进入目的地。地形和踏入格子类技能因此能接在机动技能之后。
rules.classlaw.resource_overdraft_uses_hp_name=生命补足欠缺
rules.classlaw.resource_overdraft_uses_hp_desc=技能资源不足时，每缺少 1 点改为消耗 2 点生命，但不会因此降到 1 点生命以下。
rules.classlaw.resource_overdraft_uses_hp_summary=技能缺少的资源可以用生命补足。
rules.classlaw.resource_overdraft_uses_hp_detail=技能会先支付已有资源，之后每缺少 1 点就消耗 2 点真实生命。如果这会致命，技能仍然无法发动。
rules.classlaw.owned_actions_count_as_yours_name=共享攻势
rules.classlaw.owned_actions_count_as_yours_desc=你拥有的行动单位普通攻击命中时，也会触发你的命中反应，并保留该单位作为来源。
rules.classlaw.owned_actions_count_as_yours_summary=友方受控单位的攻击可以触发你的命中反应。
rules.classlaw.owned_actions_count_as_yours_detail=受你拥有的行动单位普通攻击命中后，职业会把这次命中作为你的反应时机。攻击来源仍是该单位，所有权和循环保护仍然有效。
rules.classlaw.healing_to_shield_summary=所有治疗都会改为提供护盾，不再恢复生命。
rules.classlaw.healing_to_shield_detail=所有兼容治疗会改为提供等量护盾。真实生命不会因此上升，职业需要围绕临时防护安排恢复循环。

rules.traitspec.bound_name=%1$s · %2$s
rules.traitspec.mode_assault=强攻
rules.traitspec.mode_guard=守御
rules.traitspec.mode_flow=流动

rules.corerulevocabulary.accumulation_summary=连续完成相关行动，为下一次兼容技能蓄力。
rules.corerulevocabulary.accumulation_detail=移动、命中、受伤或等待类反应会积累一层。达到 3 层后，下一项可强化技能提高 50%% 效果并消耗蓄势。
rules.corerulevocabulary.overflow_summary=多余的%s会以一半效率转化为护盾。
rules.corerulevocabulary.overflow_detail=%s达到上限后，每溢出 2 点转化为 1 点护盾。转化不会再产生资源，因此不能无损循环。
rules.corerulevocabulary.compensation_summary=已经支付的技能真正失败时，获得少量备用护盾。
rules.corerulevocabulary.compensation_detail=已经付费的击退、治疗、净化、位移或地形效果无法发生时，改为获得 2 点护盾。之后 5 回合内不能再次代偿。
rules.corerulevocabulary.phase_shift_summary=真实生命不高于 30%% 时，原本单体的兼容技能会波及附近。
rules.corerulevocabulary.phase_shift_detail=进入低血线后获得一个可保存的相变状态。没有其它词条的兼容技能会影响相邻目标，真实生命离开阈值后结束。
rules.corerulevocabulary.echo_summary=主动技能成功后，3 回合后以一半效果重复一次。
rules.corerulevocabulary.echo_detail=延迟副本保留原目标和来源，不会继续产生新的残响；剩余延迟会随存档保存。
rules.corerulevocabulary.hunt_mark_summary=连续命中积累猎印；3 层后强化下一次后续行动。
rules.corerulevocabulary.hunt_mark_detail=每次命中增加一层持续 8 回合的猎印。达到 3 层后，下一项成功技能消耗猎印并使目标减速。
rules.corerulevocabulary.propagation_summary=带猎印的敌人死亡时，猎印转移给最近敌人。
rules.corerulevocabulary.propagation_detail=最多 2 层猎印会转移给最近的存活敌人。转移后的猎印不能再次传播，避免无限连锁。
rules.corerulevocabulary.status_feedback=苦痛回馈
rules.corerulevocabulary.status_feedback_desc=自身获得负面状态时，获得 2 点指定资源。
rules.corerulevocabulary.status_feedback_summary=获得负面状态时，获得 2 点%s。
rules.corerulevocabulary.status_feedback_detail=中毒、燃烧、减速或其它负面状态实际附着到你身上时，获得 2 点%s；原负面状态仍会正常生效。
rules.corerulevocabulary.water_flow=水脉循环
rules.corerulevocabulary.water_flow_desc=站在水中时，提高一种指定资源的获取和支付效率。
rules.corerulevocabulary.water_flow_summary=站在水中时，额外获得 1 点%s，相关技能少消耗 1 点。
rules.corerulevocabulary.water_flow_detail=站在水中获得%s时额外获得 1 点；消耗至少 2 点该资源的技能会少消耗 1 点。
rules.corerulevocabulary.kill_tempo=猎杀节奏
rules.corerulevocabulary.kill_tempo_desc=击杀会缩短全部技能冷却，并恢复少量主要资源。
rules.corerulevocabulary.kill_tempo_summary=击杀使所有冷却缩短 2 回合，并恢复 1 点主要资源。
rules.corerulevocabulary.kill_tempo_detail=每次归属于你的击杀都会推进所有已保存冷却 2 回合；若职业有非生命的主要资源，还会获得 1 点。
rules.corerulevocabulary.kinetic_mark=动势刻印
rules.corerulevocabulary.kinetic_mark_desc=强制移动敌人时，在其身上施加猎印。
rules.corerulevocabulary.kinetic_mark_summary=击退、拉近或投掷敌人时，为其增加 1 层猎印。
rules.corerulevocabulary.kinetic_mark_detail=成功强制位移会增加一层持续 8 回合的猎印，让站位技能可以连接标记后续，但不会直接增加伤害。
rules.corerulevocabulary.mobile_charge=步调蓄能
rules.corerulevocabulary.mobile_charge_desc=每移动三次，恢复一点指定资源。
rules.corerulevocabulary.mobile_charge_summary=每第三次移动获得 1 点%s。
rules.corerulevocabulary.mobile_charge_detail=正常移动会推进一个可保存计数；第三次移动时重置计数并获得 1 点%s。强制位移只有在职业法则重新解释后才计入。
rules.corerulevocabulary.temp_hp_payment=借命施术
rules.corerulevocabulary.temp_hp_payment_desc=消耗生命的技能会优先使用临时生命支付。
rules.corerulevocabulary.temp_hp_payment_summary=技能的生命消耗会先扣除临时生命，再扣真实生命。
rules.corerulevocabulary.temp_hp_payment_detail=技能要求支付生命时，会先消耗独立且会到期的临时生命池；不足部分才扣除真实生命。低生命条件仍只检查真实生命。
rules.corerulevocabulary.piercing_mark=远袭刻印
rules.corerulevocabulary.piercing_mark_desc=投射物和射线命中时，为目标施加猎印。
rules.corerulevocabulary.piercing_mark_summary=投射物或射线实际命中后，增加 1 层猎印。
rules.corerulevocabulary.piercing_mark_detail=投射物或射线真正触及的每个目标都会获得一层持续 8 回合的猎印。墙体、射程、筛选和未命中仍会阻止刻印。
rules.corerulevocabulary.owned_resource_feedback=群体节律
rules.corerulevocabulary.owned_resource_feedback_desc=受你拥有的行动单位普通攻击命中后，恢复指定资源。
rules.corerulevocabulary.owned_resource_feedback_summary=受控行动单位普通攻击命中时，获得 1 点%s。
rules.corerulevocabulary.owned_resource_feedback_detail=真实参与回合的受控单位普通攻击命中后，获得 1 点%s。装置和领域使用另一项自动化回馈特质。
rules.corerulevocabulary.carrier_resource_feedback=自动化回收
rules.corerulevocabulary.carrier_resource_feedback_desc=部署物成功影响目标时，恢复指定资源。
rules.corerulevocabulary.carrier_resource_feedback_summary=装置、领域或机关成功生效时，获得 1 点%s。
rules.corerulevocabulary.carrier_resource_feedback_detail=你部署并保存的装置、领域或机关真正影响合法目标时，获得 1 点%s；空触发不会提供资源。
rules.corerulevocabulary.hazard_feedback=险境采集
rules.corerulevocabulary.hazard_feedback_desc=把敌人强制移动到水面或陷阱时，恢复指定资源。
rules.corerulevocabulary.hazard_feedback_summary=将敌人强制移入水面或陷阱时，获得 2 点%s。
rules.corerulevocabulary.hazard_feedback_detail=你的击退、拉近或投掷最终落在水面或陷阱格时，获得 2 点%s。地形必须已经存在，且位移必须真正成功。
rules.corerulevocabulary.mode_guard=切换护势
rules.corerulevocabulary.mode_guard_desc=进入一个指定模式时，获得短暂临时生命。
rules.corerulevocabulary.mode_guard_summary=进入%s时，获得持续 4 回合的 3 点临时生命。
rules.corerulevocabulary.mode_guard_detail=模式技能成功进入%s时，获得独立的 3 点临时生命，持续 4 回合。重复进入会刷新该生命池，不会制造永久生命。
rules.corerulevocabulary.transfer_feedback=转移红利
rules.corerulevocabulary.transfer_feedback_desc=转移或复制成功时，恢复指定资源。
rules.corerulevocabulary.transfer_feedback_summary=转移或复制成功后，获得 1 点%s。
rules.corerulevocabulary.transfer_feedback_detail=资源、状态、标记或护盾的合法转移/复制真正改变目标后，获得 1 点%s；受保护或失败的操作不会提供收益。
rules.corerulevocabulary.status_chain=刻印苦痛
rules.corerulevocabulary.status_chain_desc=对带猎印目标施加状态时，消耗一层猎印并使其易伤。
rules.corerulevocabulary.status_chain_summary=状态命中带猎印目标时，消耗 1 层并施加 3 回合易伤。
rules.corerulevocabulary.status_chain_detail=你的状态效果真正附着到带猎印目标时，消耗一层猎印并施加 3 回合易伤；被抵抗的状态不会消耗猎印。

rules.playerfacingvalidationissue.missing_required_selection_short=保存前请选择%s。
rules.playerfacingvalidationissue.missing_required_selection_detail=技能或职业要实际使用，必须先完成这一项。
rules.playerfacingvalidationissue.incompatible_delivery_short=%1$s无法用当前方式投放%2$s。
rules.playerfacingvalidationissue.incompatible_delivery_detail=请选择能够真正抵达当前效果和目标的投放方式。
rules.playerfacingvalidationissue.incompatible_target_short=%1$s无法影响%2$s。
rules.playerfacingvalidationissue.incompatible_target_detail=请修改目标选择、作用范围或目标筛选，让效果拥有合法对象。
rules.playerfacingvalidationissue.incompatible_effect_short=%1$s无法使用当前技能词条“%2$s”。
rules.playerfacingvalidationissue.incompatible_effect_detail=技能词条必须改变主要效果实际支持的执行方式。
rules.playerfacingvalidationissue.missing_effect_parameter_short=请完成“%s”的具体设置。
rules.playerfacingvalidationissue.missing_effect_parameter_detail=该效果仍缺少有效的强度、持续时间、资源、状态或参数页中列出的其它设置。
rules.playerfacingvalidationissue.missing_resource_short=技能需要消耗“%s”，但职业没有这个资源池。
rules.playerfacingvalidationissue.missing_resource_detail=请为职业添加对应资源，或改用其它消耗方式。
rules.playerfacingvalidationissue.invalid_cost_short=当前技能消耗无法支付。
rules.playerfacingvalidationissue.invalid_cost_detail=请选择已存在的资源、合法物品、已有状态、生命、行动时间或冷却。
rules.playerfacingvalidationissue.invalid_constraint_short=“%s”与当前技能冲突。
rules.playerfacingvalidationissue.invalid_constraint_detail=请修改使用限制，或修改与其冲突的技能消耗。
rules.playerfacingvalidationissue.secondary_incompatible_short=附加效果“%1$s”无法使用目标设置“%2$s”。
rules.playerfacingvalidationissue.secondary_incompatible_detail=附加效果与主要效果共用同一次投放和目标，因此两者都必须接受当前目标。
rules.playerfacingvalidationissue.unsupported_runtime_capability_short=“%s”目前不能实际使用。
rules.playerfacingvalidationissue.unsupported_runtime_capability_detail=请选择已经完整支持真实玩法路径的效果。
rules.playerfacingvalidationissue.skill_budget_overflow_short=保存这个技能后，职业预算会超出 %1$d 点。
rules.playerfacingvalidationissue.skill_budget_overflow_detail=技能占用 %2$d 点，但保存前只剩 %3$d 点预算。
rules.playerfacingvalidationissue.class_budget_overflow_short=职业预算超出 %1$d 点（%2$d / %3$d）。
rules.playerfacingvalidationissue.class_budget_overflow_detail=请移除或降低正面组件，或接受一项兼容且会返还预算的限制。
rules.playerfacingvalidationissue.build_integrity_broken_short=%s
rules.playerfacingvalidationissue.build_integrity_broken_detail=当前职业存在确定的玩法断裂，修复后才能进入地牢。
rules.playerfacingvalidationissue.law_trait_incompatible_short=%1$s暂时无法生效：%2$s
rules.playerfacingvalidationissue.law_trait_incompatible_detail=请添加所需的玩法来源，或选择其它法则/特质。
rules.playerfacingvalidationissue.unresolved_dependency_short=仍需补齐：%s
rules.playerfacingvalidationissue.unresolved_dependency_detail=草稿可以先保留这项组件，再补上需要的资源、状态、模式、实体或玩法来源；补齐前不能进入地牢。
