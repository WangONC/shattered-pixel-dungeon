challenges.no_food=缩餐节食
challenges.no_food_desc=食物本就稀缺，但你还需要注意节食！\n\n-使用各类食物与丰饶之角的饱腹效果为原本的三分之一\n-其他恢复饥饿的机制不受影响
challenges.no_armor=信念护体
challenges.no_armor_desc=如今护甲已难堪大用，你只能相信你自己的肉身了！\n\n-布甲之外所有护甲的基本防御力降低\n-所有护甲升级提供的防御力成长大幅降低\n-灵壤守卫的防御力大幅降低
challenges.no_healing=恐药异症
challenges.no_healing_desc=治疗药剂真是种好东西，可惜你对它过敏！\n\n-治疗药剂、以治疗药剂为原料炼制的道具与阳光果将无法治愈英雄，反而会使英雄中毒\n-紊乱魔药不会随机到治愈英雄或使英雄中毒的效果\n-这些道具对其他单位依然发挥正常效果。
challenges.no_herbalism=荒芜之地
challenges.no_herbalism_desc=这个晦气的地牢里连干净的水都没有了...\n\n-移除露珠\n-移除所有特殊植物\n-高草依然会掉落种子，但种子不会生根发芽
challenges.swarm_intelligence=集群智能
challenges.swarm_intelligence_desc=要小心了，地牢里的怪物们也在学习进步！\n\n-当你被敌人发现时，附近的其他敌人也会被吸引到那里。
challenges.darkness=没入黑暗
challenges.darkness_desc=地牢毕竟是在地下嘛！\n\n-正常视野范围显著缩小\n-每层都会出现一根火把\n-其他光源有效性降至1/5
challenges.no_scrolls=禁忌咒文
challenges.no_scrolls_desc=一种卷轴会变得更稀有。不幸的是，总是最有用的那一种。\n\n-移除地牢中半数的升级卷轴
challenges.champion_enemies=精英强敌
challenges.champion_enemies_desc=道高一尺，魔高一丈！\n\n普通敌人生成时会有概率获得特殊的精英强敌效果，概率会从1层的1/8增长至21层的1/6。\n\n-精英强敌不以沉睡状态生成\n-精英强敌生成时英雄会察觉\n-精英强敌无法被转化为盟友\n\n一共有六种精英强敌效果：\n_烈焰(橙)：_近战伤害+25%，攻击时点燃，死亡时起火(不点燃水体)\n_索敌(紫)：_近战伤害+25%，近战范围+3\n_敌法(绿)：_所受伤害-50%，免疫魔法效果\n_巨型(蓝)：_所受伤害-80%，近战范围+1，无法进入门道\n_天佑(黄)：_精准、闪避x4\n_成长(红)：_精准、闪避、攻击伤害与有效生命+20%，每4回合以上属性成长1%
challenges.stronger_bosses=绝命头目
challenges.stronger_bosses_desc=这项挑战会让所有Boss都更具挑战性！\n\n_粘咕：_生命值+20%\n_-_持续处于水中时，生命回复量递增，最高至每回合3点\n_-_爆发攻击蓄力时间由2回合缩短至1回合\n_天狗：_生命+25%\n_-_第一阶段：陷阱更加致命\n_-_第二阶段：技能频率更高\n_DM-300：_生命+33%\n_-_能量塔更坚固，并且需要击毁3座\n_-_技能频率更高，威力也更强大\n_-_超载时移动速度更高\n_-_地表导线数量为原先的两倍\n_矮人国王：_生命+50%\n_-_所有阶段中都会召唤更多强力随从\n_-_第一阶段：更高的技能与召唤频率\n_-_第二阶段：每轮额外召唤两名随从\n_-_第三阶段：生命值+100%，进一步提高召唤频率\n_Yog-Dzewa：_\n_-_同时召唤两个古神之拳！\n_-_激光攻击伤害+60%\n_-_召唤更强大的随从

rankings$record.something=在黑暗中被击杀
rankings$record.won=获得Yendor护符
rankings$record.ascended=成功携带护符回到地面！

rules.resourceengine.mana=法力
rules.resourceengine.rage=怒气
rules.resourceengine.blood=血能
rules.resourceengine.momentum=动量
rules.resourceengine.focus=专注
rules.resourceengine.affliction=苦痛
rules.resourceengine.manual=自定义资源
rules.resourceengine.mana_desc=法力会随回合逐渐恢复，适合保存力量并在关键时机发动技能。
rules.resourceengine.rage_desc=受伤与近战命中会积累怒气，脱离战斗后逐渐衰减。适合持续贴身作战并承担可控风险。
rules.resourceengine.blood_desc=技能直接使用生命支付消耗。每次发动都在用当前安全换取力量。
rules.resourceengine.momentum_desc=持续移动会更快积累动量；停下会打断节奏，等待甚至会使其归零。适合不断移动和连续进攻的职业。
rules.resourceengine.focus_desc=等待或保持安全会积累专注，受到攻击则会打断积累。适合蓄力、控场和创造安全窗口。
rules.resourceengine.affliction_desc=负面状态会转化为苦痛。中毒与燃烧依然危险，但主动承担它们也能为技能提供力量。
rules.resourceengine.manual_desc=完全可编辑的资源。你可以自由设置名称、容量、初始值、获得方式、损失方式和主动补充规则。
rules.resourceregistry.blood_preset_desc=一个名为“血能”的空白可编辑资源。你可以自行设置获得、损失与补充方式；消耗生命仍然属于技能消耗选项。

qa.archetypereferencebuilds.martial_defender_name=近战守卫
qa.archetypereferencebuilds.martial_defender_desc=坚守接触距离，承受压力，并把敌人的攻击转化为反击和位移。
qa.archetypereferencebuilds.blood_berserker_name=血怒战士
qa.archetypereferencebuilds.blood_berserker_desc=以真实生命换取力量，主动维持危险血线，并依靠临时防御存活。
qa.archetypereferencebuilds.ammo_gunner_name=弹药射手
qa.archetypereferencebuilds.ammo_gunner_desc=用装填空档与有限弹药，换取远程、穿透和连射优势。
qa.archetypereferencebuilds.area_caster_name=范围术士
qa.archetypereferencebuilds.area_caster_desc=消耗法力使用射线、地面控制和群体压制，同时保留便宜的单体手段。
qa.archetypereferencebuilds.mark_assassin_name=猎印刺客
qa.archetypereferencebuilds.mark_assassin_desc=标记目标并重新定位，再消耗铺垫发动残血爆发与斩杀。
qa.archetypereferencebuilds.owned_summoner_name=契约召唤者
qa.archetypereferencebuilds.owned_summoner_desc=部署短寿命的己方实体，指挥集火，让独立实体回合承担主要压力。
qa.archetypereferencebuilds.device_engineer_name=装置自动师
qa.archetypereferencebuilds.device_engineer_desc=消耗燃料部署装置、场域和陷阱，再诱导敌人进入自动响应范围。
qa.archetypereferencebuilds.terrain_controller_name=地形操控者
qa.archetypereferencebuilds.terrain_controller_desc=改变地面与危险区域，再利用水域限定的强制位移让站位产生价值。
qa.archetypereferencebuilds.status_controller_name=状态织法者
qa.archetypereferencebuilds.status_controller_desc=建立中毒、燃烧、连锁和传播网络，而不是依赖直接伤害。
qa.archetypereferencebuilds.mode_shifter_name=模式转换者
qa.archetypereferencebuilds.mode_shifter_desc=在攻势与守势模式间切换，使最佳合法行动随战斗压力改变。
qa.archetypereferencebuilds.reaction_only_name=纯反应构筑
qa.archetypereferencebuilds.reaction_only_desc=不使用主动技巧；接触、受伤和击杀事件构成全部战斗循环。
qa.archetypereferencebuilds.resourceless_cooldown_name=无资源冷却构筑
qa.archetypereferencebuilds.resourceless_cooldown_desc=不使用资源池，完全通过冷却和行动承诺控制强力技巧节奏。
qa.archetypereferencebuilds.dual_resource_name=双资源构筑
qa.archetypereferencebuilds.dual_resource_desc=维护两个来源与用途不同的资源池，而不是共享一种万能货币。
qa.archetypereferencebuilds.transfer_support_name=转移支援构筑
qa.archetypereferencebuilds.transfer_support_desc=创建己方盟友，并在参与者之间转移可转移状态和防御价值。
qa.archetypereferencebuilds.pure_control_name=纯控场构筑
qa.archetypereferencebuilds.pure_control_desc=以位移和行动限制为主，刻意只保留很低的直接伤害。

rules.restriction.none_name=无限制
rules.restriction.none_desc=没有额外玩法代价。
rules.restriction.no_ordinary_weapons_name=不能使用普通武器
rules.restriction.no_ordinary_weapons_desc=无法装备普通武器。
rules.restriction.weak_healing_name=弱效治疗药水
rules.restriction.weak_healing_desc=治疗药水的恢复量降低至 35%。
rules.restriction.frail_name=脆弱体质
rules.restriction.frail_desc=最大生命降低 5 点。
rules.restriction.no_traditional_healing_name=不能普通治疗
rules.restriction.no_traditional_healing_desc=治疗药水仍能净化状态，但不恢复生命。
rules.restriction.wait_clears_resource_name=等待清空资源
rules.restriction.wait_clears_resource_desc=每次等待都会清空当前职业资源。
rules.restriction.active_costs_hp_name=主动技能额外耗血
rules.restriction.active_costs_hp_desc=每次使用主动技能额外消耗 2 点生命。

rules.classlaw.healing_to_shield_name=治疗转护盾
rules.classlaw.healing_to_shield_desc=治疗药水与规则治疗不再恢复生命，而是生成屏障。
rules.classlaw.resource_overflow_to_shield_name=资源溢出转护盾
rules.classlaw.resource_overflow_to_shield_desc=超出资源上限的获得量会转化为屏障。
rules.classlaw.status_absorption_name=状态吸收
rules.classlaw.status_absorption_desc=负面状态仍会生效，但每次都会额外产生资源。
rules.classlaw.water_affinity_name=亲水法则
rules.classlaw.water_affinity_desc=站在水中时，正向资源获得量增加，且大于 1 点的资源消耗减少 1 点。
rules.classlaw.kill_accelerates_rules_name=猎杀节奏
rules.classlaw.kill_accelerates_rules_desc=击杀会缩短所有技能冷却并获得资源。

