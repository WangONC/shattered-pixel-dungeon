rules.resourceengine.mana=Mana
rules.resourceengine.rage=Rage
rules.resourceengine.blood=Blood
rules.resourceengine.momentum=Momentum
rules.resourceengine.focus=Focus
rules.resourceengine.affliction=Affliction
rules.resourceengine.manual=Custom Resource
rules.resourceengine.mana_desc=Mana gradually returns as turns pass. It supports techniques that save power for the right moment.
rules.resourceengine.rage_desc=Taking damage and landing melee hits builds Rage, which fades outside combat. It rewards staying engaged and accepting measured risks.
rules.resourceengine.blood_desc=Techniques pay their cost directly from your health. Every use trades immediate safety for power.
rules.resourceengine.momentum_desc=Moving continuously builds Momentum faster. Stopping slows the rhythm, and waiting can erase it; this favors mobile, relentless play.
rules.resourceengine.focus_desc=Waiting or remaining safe builds Focus, while taking damage breaks concentration. It favors planning, control, and creating safe openings.
rules.resourceengine.affliction_desc=Negative statuses become Affliction. Poison and burning remain dangerous, but accepting them can also fuel your techniques.
rules.resourceengine.manual_desc=A fully editable resource. Set its name, capacity, starting value, gains, losses, and active refill rules.
rules.resourceregistry.blood_preset_desc=An empty, editable resource named Blood. Configure how it is gained, lost, and refilled; health costs remain a separate Skill Cost choice.

qa.archetypereferencebuilds.martial_defender_name=Martial Defender
qa.archetypereferencebuilds.martial_defender_desc=Hold contact range, absorb pressure, and turn enemy attacks into counters and displacement.
qa.archetypereferencebuilds.blood_berserker_name=Blood Berserker
qa.archetypereferencebuilds.blood_berserker_desc=Spend real health for power, remain at a dangerous health threshold, and survive through temporary defenses.
qa.archetypereferencebuilds.ammo_gunner_name=Ammo Gunner
qa.archetypereferencebuilds.ammo_gunner_desc=Trade reload downtime and finite ammunition for long-range, piercing, and repeated shots.
qa.archetypereferencebuilds.area_caster_name=Area Caster
qa.archetypereferencebuilds.area_caster_desc=Spend mana on beams, ground control, and multi-target pressure while preserving a cheaper single-target option.
qa.archetypereferencebuilds.mark_assassin_name=Mark Finisher
qa.archetypereferencebuilds.mark_assassin_desc=Mark a target, reposition, then consume that preparation for missing-health and execution attacks.
qa.archetypereferencebuilds.owned_summoner_name=Owned Summoner
qa.archetypereferencebuilds.owned_summoner_desc=Deploy short-lived owned actors, command their focus, and let entity turns provide most of the pressure.
qa.archetypereferencebuilds.device_engineer_name=Device Automator
qa.archetypereferencebuilds.device_engineer_desc=Spend fuel to deploy persistent devices, fields, and traps, then lure enemies through automated responses.
qa.archetypereferencebuilds.terrain_controller_name=Terrain Controller
qa.archetypereferencebuilds.terrain_controller_desc=Alter ground and hazards, then exploit water-gated forced movement to make position matter.
qa.archetypereferencebuilds.status_controller_name=Status Controller
qa.archetypereferencebuilds.status_controller_desc=Build a network of poison, burning, chains, and propagation instead of relying on raw direct damage.
qa.archetypereferencebuilds.mode_shifter_name=Mode Shifter
qa.archetypereferencebuilds.mode_shifter_desc=Switch between assault and guard modes so the best legal action changes with combat pressure.
qa.archetypereferencebuilds.reaction_only_name=Reaction-only Build
qa.archetypereferencebuilds.reaction_only_desc=Use no active technique; contact, damage, and kill events are the entire combat engine.
qa.archetypereferencebuilds.resourceless_cooldown_name=Cooldown Build
qa.archetypereferencebuilds.resourceless_cooldown_desc=Use no resource pool and pace strong actions entirely through cooldown and committed turns.
qa.archetypereferencebuilds.dual_resource_name=Dual-resource Build
qa.archetypereferencebuilds.dual_resource_desc=Maintain two independent pools with different sources and sinks instead of one universal currency.
qa.archetypereferencebuilds.transfer_support_name=Transfer Support Build
qa.archetypereferencebuilds.transfer_support_desc=Create an owned ally, then move transferable status and defensive value between participants.
qa.archetypereferencebuilds.pure_control_name=Pure Control Build
qa.archetypereferencebuilds.pure_control_desc=Prioritize movement and action denial with intentionally little direct damage.

