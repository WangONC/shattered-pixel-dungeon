rules.corerulevocabulary.none=No Core Entry
rules.corerulevocabulary.none_desc=Leave this slot empty and spend no Rule Capacity.
rules.corerulevocabulary.accumulation=Accumulation
rules.corerulevocabulary.accumulation_desc=Your reaction's Move, Hit, Damaged, or Wait event builds Accumulation. At 3 stacks, the next compatible technique gains 50% power, then consumes the charge.
rules.corerulevocabulary.overdraw=Overdraw
rules.corerulevocabulary.overdraw_desc=When a technique lacks resource, each missing point can be paid with 2 health. Overdraw can never reduce you below 1 health.
rules.corerulevocabulary.overflow=Overflow
rules.corerulevocabulary.overflow_desc=After your resource reaches its cap, every 2 excess points become 1 Shield. Conversion never produces resource, preventing a lossless loop.
rules.corerulevocabulary.compensation=Compensation
rules.corerulevocabulary.compensation_desc=If a paid technique's effect truly cannot happen, gain 2 Shield instead. Compensation then locks for 5 turns.
rules.corerulevocabulary.phase_shift=Phase Shift
rules.corerulevocabulary.phase_shift_desc=At 30% health or less, techniques without another modifier affect nearby targets. Leaving low health ends this mode.
rules.corerulevocabulary.echo=Echo
rules.corerulevocabulary.echo_desc=After a successful active technique, repeat one weakened copy 3 turns later. An Echo cannot create another Echo.
rules.corerulevocabulary.hunt_mark=Hunt Mark
rules.corerulevocabulary.hunt_mark_desc=Repeated hits on the same enemy build Hunt Mark. At 3 stacks, your next successful technique against it consumes the marks and Slows it.
rules.corerulevocabulary.propagation=Propagation
rules.corerulevocabulary.propagation_desc=When a Hunted enemy dies, up to 2 Hunt Mark stacks pass to the nearest enemy. A transferred mark cannot propagate again.
rules.corerulevocabulary.inertia_bridge=Inertial Link
rules.corerulevocabulary.inertia_bridge_desc=Forced movement also counts as movement, allowing Push and Pull to trigger your movement reaction.
rules.corerulevocabulary.translocation_bridge=Arrival Link
rules.corerulevocabulary.translocation_bridge_desc=Teleporting or swapping places also counts as entering a tile, allowing translocation to trigger your tile-entry reaction.
rules.corerulevocabulary.translocation_backlash=Translocation Backlash
rules.corerulevocabulary.translocation_backlash_desc=Teleporting or swapping places Slows you for 3 turns. The price is tied to the mobility you used.
rules.corerulevocabulary.shield_backlash=Bulwark Backlash
rules.corerulevocabulary.shield_backlash_desc=Whenever a rule grants Shield, you also become Vulnerable for 3 turns.
rules.classlaw.forced_movement_counts_as_move_name=Inertia Is Movement
rules.classlaw.forced_movement_counts_as_move_desc=Whenever one of your skills forcibly moves a character, that displacement also triggers your movement reactions.
rules.classlaw.forced_movement_counts_as_move_summary=Pushes, pulls, and throws also count as movement.
rules.classlaw.forced_movement_counts_as_move_detail=Every successful forced displacement is interpreted as a movement event while preserving its original cause. This affects the whole class and can activate any compatible movement reaction.
rules.classlaw.translocation_counts_as_enter_tile_name=Arrival Is Entry
rules.classlaw.translocation_counts_as_enter_tile_desc=Teleporting, dashing, or swapping places also triggers your enter-tile reactions at the destination.
rules.classlaw.translocation_counts_as_enter_tile_summary=Translocation also counts as entering the destination tile.
rules.classlaw.translocation_counts_as_enter_tile_detail=Each successful teleport, dash, or position swap is treated as entering its destination. Terrain and tile-entry skills can therefore follow your mobility skills.
rules.classlaw.resource_overdraft_uses_hp_name=Life Pays the Deficit
rules.classlaw.resource_overdraft_uses_hp_desc=If a skill lacks resource, each missing point costs 2 health instead. It can never reduce you below 1 health.
rules.classlaw.resource_overdraft_uses_hp_summary=Missing skill resource can be paid with health.
rules.classlaw.resource_overdraft_uses_hp_detail=Resource is paid first. Each unpaid point then costs 2 real health, and the skill remains unavailable when that payment would be fatal.
rules.classlaw.owned_actions_count_as_yours_name=Shared Initiative
rules.classlaw.owned_actions_count_as_yours_desc=A successful normal attack by your owned actor also triggers your on-hit reactions, with that actor preserved as the source.
rules.classlaw.owned_actions_count_as_yours_summary=Owned allies' attacks can trigger your hit reactions.
rules.classlaw.owned_actions_count_as_yours_detail=When an owned acting unit lands a normal attack, the class treats that hit as yours for reaction timing. The ally remains the source, so ownership and recursion safeguards still apply.
rules.classlaw.healing_to_shield_summary=All healing becomes Shield instead of restoring health.
rules.classlaw.healing_to_shield_detail=Every compatible healing source grants the same amount as Shield. Your real health no longer rises from those effects, so the class must plan around temporary protection.

rules.traitspec.bound_name=%1$s · %2$s
rules.traitspec.mode_assault=Assault
rules.traitspec.mode_guard=Guard
rules.traitspec.mode_flow=Flow

rules.corerulevocabulary.accumulation_summary=Relevant repeated actions prepare one stronger compatible skill.
rules.corerulevocabulary.accumulation_detail=Move, hit, damaged, or wait reactions build one stack. At 3 stacks, the next scalable skill gains 50%% power and consumes the stored charge.
rules.corerulevocabulary.overflow_summary=Excess %s becomes Shield at half efficiency.
rules.corerulevocabulary.overflow_detail=After %s reaches its maximum, every 2 excess points become 1 Shield. This conversion never creates resource, preventing a lossless return loop.
rules.corerulevocabulary.compensation_summary=A paid skill that truly fails grants a small fallback Shield.
rules.corerulevocabulary.compensation_detail=When a paid push, heal, cleanse, movement, or terrain effect cannot happen, gain 2 Shield. This fallback then locks for 5 turns.
rules.corerulevocabulary.phase_shift_summary=At 30%% health or less, otherwise single-target skills gain nearby reach.
rules.corerulevocabulary.phase_shift_detail=Crossing into low health enters a saved phase state. Compatible skills without another affix gain an adjacent area until real health rises above the threshold.
rules.corerulevocabulary.echo_summary=Successful active skills repeat once at half power after 3 turns.
rules.corerulevocabulary.echo_detail=The delayed copy keeps the original target and cause. The copy cannot create another Echo, and its remaining delay survives saving and loading.
rules.corerulevocabulary.hunt_mark_summary=Repeated hits build Hunt Mark; 3 stacks empower the next follow-up.
rules.corerulevocabulary.hunt_mark_detail=Each hit adds one Hunt Mark for 8 turns. At 3 stacks, the next successful skill consumes them and Slows that target.
rules.corerulevocabulary.propagation_summary=Hunt Mark moves to the nearest enemy when its target dies.
rules.corerulevocabulary.propagation_detail=Up to 2 Hunt Mark stacks move to the nearest living enemy. A transferred mark cannot propagate again, limiting the chain.
rules.corerulevocabulary.status_feedback=Affliction Feedback
rules.corerulevocabulary.status_feedback_desc=Receiving a negative status grants 2 points of the chosen resource.
rules.corerulevocabulary.status_feedback_summary=A negative status grants 2 %s.
rules.corerulevocabulary.status_feedback_detail=When Poison, Burning, Slow, or another negative status actually attaches to you, gain 2 %s. The status still takes effect.
rules.corerulevocabulary.water_flow=Water Flow
rules.corerulevocabulary.water_flow_desc=Standing in water improves one chosen resource's gains and payments.
rules.corerulevocabulary.water_flow_summary=In water, gain +1 %s and pay 1 less for its skills.
rules.corerulevocabulary.water_flow_detail=Whenever you gain %s while standing in water, gain 1 extra. Skills costing at least 2 points of that pool cost 1 less while you remain in water.
rules.corerulevocabulary.kill_tempo=Kill Tempo
rules.corerulevocabulary.kill_tempo_desc=Kills shorten every skill cooldown and restore a little primary resource.
rules.corerulevocabulary.kill_tempo_summary=Kills shorten cooldowns by 2 turns and restore 1 primary resource.
rules.corerulevocabulary.kill_tempo_detail=Each kill credited to you advances all saved cooldowns by 2 turns. If the class has a primary non-health pool, it also gains 1 point.
rules.corerulevocabulary.kinetic_mark=Kinetic Mark
rules.corerulevocabulary.kinetic_mark_desc=Forcibly moving an enemy places Hunt Mark on it.
rules.corerulevocabulary.kinetic_mark_summary=Push, pull, or throw adds 1 Hunt Mark to the moved enemy.
rules.corerulevocabulary.kinetic_mark_detail=A successful forced displacement adds one 8-turn Hunt Mark. This connects positioning skills to marked-target follow-ups without adding damage.
rules.corerulevocabulary.mobile_charge=Measured Pace
rules.corerulevocabulary.mobile_charge_desc=Every third move restores one point of a chosen resource.
rules.corerulevocabulary.mobile_charge_summary=Every third move grants 1 %s.
rules.corerulevocabulary.mobile_charge_detail=Normal movement advances a saved counter. On the third move, the counter resets and grants 1 %s; forced movement does not count unless a Law reinterprets it.
rules.corerulevocabulary.temp_hp_payment=Borrowed Vitality
rules.corerulevocabulary.temp_hp_payment_desc=Health-cost skills spend Temporary Health before real health.
rules.corerulevocabulary.temp_hp_payment_summary=Temporary Health can pay health costs before real health.
rules.corerulevocabulary.temp_hp_payment_detail=When a skill asks for health, its cost consumes your independently expiring Temporary Health first. Any unpaid remainder comes from real health, so low-health checks still use real HP.
rules.corerulevocabulary.piercing_mark=Ranging Mark
rules.corerulevocabulary.piercing_mark_desc=Projectile and beam hits place Hunt Mark on their targets.
rules.corerulevocabulary.piercing_mark_summary=Successful projectile or beam effects add 1 Hunt Mark.
rules.corerulevocabulary.piercing_mark_detail=Each target actually reached by a projectile or beam receives one 8-turn Hunt Mark. Walls, range, filters, and misses still prevent the mark.
rules.corerulevocabulary.owned_resource_feedback=Pack Rhythm
rules.corerulevocabulary.owned_resource_feedback_desc=An owned actor's successful normal attack restores a chosen resource.
rules.corerulevocabulary.owned_resource_feedback_summary=Owned actors' normal hits grant 1 %s.
rules.corerulevocabulary.owned_resource_feedback_detail=Whenever a real owned acting unit lands a normal attack, gain 1 %s. Devices and fields use their separate feedback Trait.
rules.corerulevocabulary.carrier_resource_feedback=Automation Return
rules.corerulevocabulary.carrier_resource_feedback_desc=A deployed carrier that successfully affects a target restores a chosen resource.
rules.corerulevocabulary.carrier_resource_feedback_summary=Successful device, field, or trap effects grant 1 %s.
rules.corerulevocabulary.carrier_resource_feedback_detail=When one of your saved devices, fields, or traps actually affects a legal target, gain 1 %s. Empty activations provide nothing.
rules.corerulevocabulary.hazard_feedback=Hazard Harvest
rules.corerulevocabulary.hazard_feedback_desc=Forcing an enemy onto water or a trap restores a chosen resource.
rules.corerulevocabulary.hazard_feedback_summary=Forced movement into water or a trap grants 2 %s.
rules.corerulevocabulary.hazard_feedback_detail=When your push, pull, or throw ends on a water or trap cell, gain 2 %s. The terrain must already exist and the displacement must succeed.
rules.corerulevocabulary.mode_guard=Transition Guard
rules.corerulevocabulary.mode_guard_desc=Entering one chosen mode grants short-lived Temporary Health.
rules.corerulevocabulary.mode_guard_summary=Entering %s grants 3 Temporary Health for 4 turns.
rules.corerulevocabulary.mode_guard_detail=Whenever a successful mode-shift skill enters %s, gain an independent 3-point Temporary Health pool for 4 turns. Repeated entry refreshes the pool rather than creating actors or permanent health.
rules.corerulevocabulary.transfer_feedback=Transfer Dividend
rules.corerulevocabulary.transfer_feedback_desc=Successful transfer or copy effects restore a chosen resource.
rules.corerulevocabulary.transfer_feedback_summary=A successful transfer or copy grants 1 %s.
rules.corerulevocabulary.transfer_feedback_detail=After a legal Resource, Status, Mark, or Barrier transfer/copy changes its target, gain 1 %s. Protected or failed transfers provide nothing.
rules.corerulevocabulary.status_chain=Marked Affliction
rules.corerulevocabulary.status_chain_desc=Applying a status to a Hunted target consumes one mark and makes it Vulnerable.
rules.corerulevocabulary.status_chain_summary=Status on a Hunted target consumes 1 mark and adds 3 turns of Vulnerable.
rules.corerulevocabulary.status_chain_detail=When one of your status effects actually applies to a target with Hunt Mark, consume one stack and add 3 turns of Vulnerable. A resisted status does not consume the mark.

