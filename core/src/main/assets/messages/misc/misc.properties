rules.playerfacingvalidationissue.invalid_constraint_short=%s conflicts with the current skill.
rules.playerfacingvalidationissue.invalid_constraint_detail=Change either the use restriction or the skill payment that conflicts with it.
rules.playerfacingvalidationissue.secondary_incompatible_short=Added effect %1$s cannot use target setting %2$s.
rules.playerfacingvalidationissue.secondary_incompatible_detail=The added effect shares the main skill's successful delivery and target, so both effects must accept that target.
rules.playerfacingvalidationissue.unsupported_runtime_capability_short=%s is not currently playable.
rules.playerfacingvalidationissue.unsupported_runtime_capability_detail=Choose an exposed effect whose gameplay path is fully supported.
rules.playerfacingvalidationissue.skill_budget_overflow_short=This skill would exceed the class budget by %1$d.
rules.playerfacingvalidationissue.skill_budget_overflow_detail=The skill costs %2$d, but only %3$d budget remains before saving it.
rules.playerfacingvalidationissue.class_budget_overflow_short=The class exceeds its budget by %1$d (%2$d / %3$d).
rules.playerfacingvalidationissue.class_budget_overflow_detail=Remove or reduce positive components, or accept a compatible restriction that returns budget.
rules.playerfacingvalidationissue.build_integrity_broken_short=%s
rules.playerfacingvalidationissue.build_integrity_broken_detail=The class has a definite gameplay break that must be fixed before entering the dungeon.
rules.playerfacingvalidationissue.law_trait_incompatible_short=%1$s cannot work yet: %2$s
rules.playerfacingvalidationissue.law_trait_incompatible_detail=Add the required gameplay source or choose a different Law or Trait.
rules.playerfacingvalidationissue.unresolved_dependency_short=Still needed: %s
rules.playerfacingvalidationissue.unresolved_dependency_detail=This component may stay in the draft while you add its missing resource, state, mode, entity, or gameplay source. The class cannot enter the dungeon until it is resolved.
