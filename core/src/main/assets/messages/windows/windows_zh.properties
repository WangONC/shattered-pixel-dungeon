windows.wndresurrect.title=复活
windows.wndresurrect.message=死亡正在降临，所幸重生十字架正努力引导你的灵魂回到这个世界。这给了你又一个征服地牢的机会！\n\n你可以保留两件物品，而其余物品将会留在你死去的地方。\n请做出选择吧。
